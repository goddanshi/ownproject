name: Test SSH Connection

on:
  workflow_dispatch:  # Запуск только вручную

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Debug - Show secret info (without revealing)
        run: |
          echo "VPS_HOST is set: ${{ secrets.VPS_HOST != '' }}"
          echo "VPS_USER is set: ${{ secrets.VPS_USER != '' }}"
          echo "VPS_SSH_KEY is set: ${{ secrets.VPS_SSH_KEY != '' }}"
          echo "VPS_SSH_KEY length: ${#VPS_SSH_KEY}"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Setup SSH Key manually
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Проверяем формат ключа
          echo "=== Checking key format ==="
          head -n 1 ~/.ssh/deploy_key
          tail -n 1 ~/.ssh/deploy_key

          # Добавляем хост в known_hosts
          echo "=== Adding host to known_hosts ==="
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>&1 || true

          # Пробуем подключиться с verbose
          echo "=== Attempting SSH connection ==="
          ssh -vvv -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'Connection successful!' && whoami && pwd" 2>&1 || echo "Connection failed"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
