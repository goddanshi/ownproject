name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/frontend"
          strip_components: 2
          rm: true

      - name: Deploy Backend
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude 'vendor/' --exclude 'runtime/' --exclude '*-local.php' --exclude 'backend/web/index.php' --exclude 'backend/web/index-test.php' --exclude 'frontend/web/index.php' --exclude 'frontend/web/index-test.php' --exclude 'yii' --exclude 'yii_test' --exclude 'yii_test.bat'
          path: backend/
          remote_path: /var/www/backend/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Telegram Bot
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "telegram-bot/*"
          target: "/var/www/telegram-bot"
          strip_components: 1
          overwrite: true

      - name: Post-deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/backend
            composer install --no-dev --optimize-autoloader --no-interaction
            mkdir -p backend/runtime/cache backend/web/assets frontend/runtime/cache frontend/web/assets console/runtime
            chmod +x yii
            sudo chown -R deploy:www-data /var/www
            sudo chmod -R 777 backend/runtime backend/web/assets frontend/runtime frontend/web/assets console/runtime
            php yii cache/flush-all
            sudo systemctl restart php8.4-fpm
            echo "✅ Done!"