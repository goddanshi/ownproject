name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout кода
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настройка Node.js для Vue
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Сборка Vue Frontend
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # 4. Настройка PHP для Yii2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # 5. Установка зависимостей Composer
      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # 6. Деплой Frontend
      - name: Deploy Frontend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/frontend"
          strip_components: 2
          rm: true

      # 7. Деплой Backend
      - name: Deploy Backend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/*"
          target: "/var/www/backend"
          strip_components: 1

      # 8. Деплой Telegram Bot
      - name: Deploy Telegram Bot
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "telegram-bot/*"
          target: "/var/www/telegram-bot"
          strip_components: 1

      # 9. Установка прав
      - name: Set permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo chown -R www-data:www-data /var/www/frontend
            sudo chown -R www-data:www-data /var/www/backend
            sudo chown -R www-data:www-data /var/www/telegram-bot
            sudo chmod -R 755 /var/www
            sudo chmod -R 777 /var/www/backend/backend/runtime
            sudo chmod -R 777 /var/www/backend/backend/web/assets
            sudo chmod -R 777 /var/www/backend/frontend/runtime
            sudo chmod -R 777 /var/www/backend/frontend/web/assets
            echo "✅ Deployment successful!"