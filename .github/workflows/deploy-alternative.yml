name: Deploy to VPS (Alternative with rsync)

on:
  workflow_dispatch:  # Запуск вручную для тестирования

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Настройка SSH ключа
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Тест SSH подключения
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH OK' && whoami && pwd"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # Деплой фронтенда через rsync
      - name: Deploy Frontend via rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            ./frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/frontend/

      # Деплой бэкенда через rsync
      - name: Deploy Backend via rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            --exclude 'vendor/' \
            --exclude 'runtime/' \
            --exclude '*-local.php' \
            --exclude 'backend/web/index.php' \
            --exclude 'backend/web/index-test.php' \
            --exclude 'frontend/web/index.php' \
            --exclude 'frontend/web/index-test.php' \
            --exclude 'yii' \
            --exclude 'yii_test' \
            --exclude 'yii_test.bat' \
            ./backend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/backend/

      # Деплой WebSockets через rsync
      - name: Deploy WebSockets via rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            ./WebSockets/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/WebSockets/

      # Деплой Telegram Bot через rsync
      - name: Deploy Telegram Bot via rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            ./telegram-bot/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/telegram-bot/

      # Post-deploy команды
      - name: Post-deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/backend
            composer install --optimize-autoloader --no-interaction
            mkdir -p backend/runtime/cache backend/web/assets frontend/runtime/cache frontend/web/assets console/runtime
            chmod +x yii
            sudo chown -R deploy:www-data /var/www
            sudo chmod -R 777 backend/runtime backend/web/assets frontend/runtime frontend/web/assets console/runtime
            php yii cache/flush-all
            sudo systemctl restart php8.4-fpm
            echo "✅ Done!"
          EOF

      # Очистка
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
